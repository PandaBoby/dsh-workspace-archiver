# Development overlay: mounts this checkout without installing it into a
# profile. The path-like row makes client-modules walk up from index.js to this
# package.json, so the browser half is discovered from the same checkout.
#
# Replace the placeholder below with this checkout's absolute path, then run
# from a DSH source checkout:
#
#   pnpm dsh web --patch /absolute/path/to/dsh-workspace-archiver/dev.patch.yml
- insert:
    - id: workspace-archiver-dev
      name: '/absolute/path/to/dsh-workspace-archiver/index.js'
